# ============================================================
#  GitHub Actions — Executa o monitor todo dia às 8h (horário Brasil)
#  Arquivo: .github/workflows/leilao_diario.yml
# ============================================================

name: ABC Leilão Monitor — Diário

on:
  schedule:
    # Todo dia às 11:00 UTC = 08:00 horário de Brasília
    - cron: '0 11 * * *'

  # Permite rodar manualmente pelo painel do GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitorar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 lxml

      - name: Rodar o monitor (coleta + gera dados.json + envia alertas)
        env:
          WA_NUMERO: ${{ secrets.WA_NUMERO }}
          WA_APIKEY: ${{ secrets.WA_APIKEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DEST: ${{ secrets.EMAIL_DEST }}
        run: python leilao_monitor.py

      - name: Publicar dados.json e index.html no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados.json index.html
          git diff --staged --quiet || git commit -m "🏠 Atualização - $(date '+%d/%m/%Y %H:%M')"
          git push

      - name: Salvar histórico como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historico-${{ github.run_id }}
          path: historico_*.json
          retention-days: 30
